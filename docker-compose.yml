services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # O migrate roda automaticamente a cada subida do container
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn BIBLIOTECA_DJANGO.wsgi --bind 0.0.0.0:8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      # A DATABASE_URL é fixa aqui de propósito: aponta para o banco do próprio
      # compose e nunca para o DATABASE_URL que exista no seu .env local.
      DATABASE_URL: postgres://biblioteca:biblioteca@db:5432/biblioteca
      # As variáveis abaixo são interpoladas do ambiente/arquivo .env
      CHAVE_SECRETA: ${CHAVE_SECRETA:-troque-por-uma-chave-segura}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Sistema Biblioteca <dev.cesar26@gmail.com>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-dev.cesar26@gmail.com}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  media_files:
  static_files: