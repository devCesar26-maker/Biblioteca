{% extends "ACERVO/base.html" %}
{% load django_bootstrap5 %}
{% load socialaccount %}

{% block content %}
<style>
    .logout-container {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem; /* Margem de segurança para telas pequenas */
    }

    .logout-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(17, 34, 22, 0.05), 0 8px 10px -6px rgba(17, 34, 22, 0.04);
        width: 100%;
        max-width: 400px; /* Largura ideal para não esticar em desktops */
        overflow: hidden;
    }

    .logout-header {
        padding: 2.5rem 2rem 1.5rem 2rem;
        text-align: center;
    }

    .logout-icon {
        font-size: 1.5rem;
        color: #b0413e; /* Tijolo quente */
        background-color: rgba(176, 65, 62, 0.1);
        border: 1px solid rgba(176, 65, 62, 0.2);
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin: 0 auto 1.25rem auto;
    }

    .logout-header h2 {
        color: var(--primary);
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: -0.01em;
        margin-bottom: 0.5rem;
    }

    .logout-body {
        padding: 0 2rem 2rem 2rem;
        text-align: center;
    }

    .logout-text {
        color: var(--muted-foreground);
        font-size: 0.95rem;
        margin-bottom: 2rem;
    }

    /* Grupo de botões lado a lado e responsivos */
    .button-group {
        display: flex;
        flex-direction: column; /* Empilha em telas muito pequenas */
        gap: 0.75rem;
    }

    @media (min-width: 400px) {
        .button-group {
            flex-direction: row; /* Fica lado a lado em telas normais */
        }
        .button-group > * {
            flex: 1; /* Divide o espaço igualmente */
        }
    }

    .btn-logout {
        background-color: #b0413e;
        border-color: #b0413e;
        color: #ffffff;
        font-weight: 600;
        border-radius: 8px;
        padding: 0.65rem 1rem;
        font-size: 0.95rem;
        transition: all 0.2s;
    }

    .btn-logout:hover {
        background-color: #933a36;
        border-color: #933a36;
        color: #ffffff;
    }

    .btn-cancel {
        background-color: var(--card);
        border: 1px solid var(--border);
        color: var(--foreground);
        font-weight: 600;
        border-radius: 8px;
        padding: 0.65rem 1rem;
        font-size: 0.95rem;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-cancel:hover {
        background-color: #faf8f5;
        border-color: var(--border);
        color: var(--primary);
    }

    .logout-footer {
        background-color: #faf8f5;
        border-top: 1px solid var(--border);
        padding: 1.25rem 2rem;
        text-align: center;
    }

    .link-accent {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .link-accent:hover {
        color: var(--accent);
        text-decoration: underline;
    }
</style>

<div class="logout-container">
    <div class="logout-card">
        
        <div class="logout-header">
            <div class="logout-icon">
                <i class="bi bi-box-arrow-right"></i>
            </div>
            <h2>Sair da Conta</h2>
        </div>

        <div class="logout-body">
            <p class="logout-text">Tem certeza que deseja encerrar sua sessão atual no acervo?</p>
            
            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                
                <div class="button-group">
                    <a href="{% url 'index' %}" class="btn btn-cancel">
                        Cancelar
                    </a>
                    
                    <button type="submit" class="btn btn-logout">
                        Confirmar Sair
                    </button>
                </div>
            </form>
        </div>

        <div class="logout-footer text-muted small">
            Mudou de ideia? 
            <a href="{% url 'account_login' %}" class="link-accent">Fazer Login</a>
        </div>
    </div>
</div>
{% endblock %}
