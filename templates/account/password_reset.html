{% extends "ACERVO/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    .auth-container {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
    }

    .auth-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(17, 34, 22, 0.05), 0 8px 10px -6px rgba(17, 34, 22, 0.04);
        width: 100%;
        max-width: 440px;
        overflow: hidden;
    }

    .auth-header {
        padding: 2.5rem 2rem 1.5rem 2rem;
        text-align: center;
        background: linear-gradient(to bottom, rgba(189, 150, 58, 0.06), transparent);
    }

    .auth-header h2 {
        color: var(--primary);
        font-weight: 700;
        letter-spacing: -0.01em;
    }

    .auth-icon {
        color: var(--accent);
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }

    .auth-body {
        padding: 0 2rem 2rem 2rem;
    }

    .auth-body label {
        display: block;
        color: var(--muted-foreground);
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-bottom: 0.375rem;
    }

    .auth-body input[type="email"],
    .auth-body input[type="text"],
    .auth-body input[type="password"] {
        display: block;
        width: 100%;
        padding: 0.65rem 0.85rem;
        font-size: 0.95rem;
        color: var(--foreground);
        background-color: #faf8f5;
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        box-sizing: border-box;
    }

    .auth-body input:focus {
        border-color: var(--primary);
        outline: 0;
        background-color: var(--card);
        box-shadow: 0 0 0 4px rgba(5, 62, 47, 0.08);
    }

    .auth-btn {
        display: inline-block;
        width: 100%;
        background-color: var(--primary);
        border: 1px solid var(--primary);
        color: var(--primary-foreground);
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        box-sizing: border-box;
        text-align: center;
    }

    .auth-btn:hover {
        background-color: var(--accent);
        border-color: var(--accent);
        color: var(--accent-foreground);
    }

    .auth-footer {
        background-color: #faf8f5;
        border-top: 1px solid var(--border);
        padding: 1.25rem 2rem;
        text-align: center;
    }

    .link-accent {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .link-accent:hover {
        color: var(--accent);
        text-decoration: underline;
    }
</style>

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">
                <i class="bi bi-key"></i>
            </div>
            <h2 class="h3 mb-1">Recuperar Senha</h2>
            <p class="text-muted small mb-0">
                Digite seu e-mail cadastrado abaixo para receber um link de redefinição.
            </p>
        </div>

        <div class="auth-body pt-4">
            <form method="POST" action="{% url 'account_reset_password' %}">
                {% csrf_token %}

                <div style="margin-bottom: 20px;">
                    <label for="id_email">E-mail:</label>
                    <input type="email" name="email" id="id_email" placeholder="seu-email@exemplo.com" required>
                </div>

                <button type="submit" class="auth-btn">
                    <i class="bi bi-envelope-paper me-1"></i> Enviar Link de Recuperação
                </button>
            </form>
        </div>

        <div class="auth-footer text-muted small">
            Lembrou a senha?
            <a href="{% url 'account_login' %}" class="link-accent">Fazer Login</a>
        </div>
    </div>
</div>
{% endblock %}
