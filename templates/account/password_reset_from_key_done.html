{% extends "ACERVO/base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<style>
    .auth-container {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
    }

    .auth-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(17, 34, 22, 0.05), 0 8px 10px -6px rgba(17, 34, 22, 0.04);
        width: 100%;
        max-width: 460px;
        overflow: hidden;
    }

    .auth-header {
        padding: 2.5rem 2rem 1.5rem 2rem;
        text-align: center;
        background: linear-gradient(to bottom, rgba(189, 150, 58, 0.06), transparent);
    }

    .auth-header h2 {
        color: var(--primary);
        font-weight: 700;
        letter-spacing: -0.01em;
    }

    .auth-icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background-color: rgba(5, 62, 47, 0.06);
        border: 1px solid rgba(5, 62, 47, 0.12);
        color: var(--primary);
        font-size: 1.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem auto;
    }

    .auth-body {
        padding: 0 2rem 2rem 2rem;
        text-align: center;
    }

    .auth-btn {
        display: inline-block;
        width: 100%;
        background-color: var(--primary);
        border: 1px solid var(--primary);
        color: var(--primary-foreground);
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        box-sizing: border-box;
        text-align: center;
    }

    .auth-btn:hover {
        background-color: var(--accent);
        border-color: var(--accent);
        color: var(--accent-foreground);
    }
</style>

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">
                <i class="bi bi-check2-circle"></i>
            </div>
            <h2 class="h3 mb-1">Senha Alterada!</h2>
        </div>

        <div class="auth-body">
            <p style="color: var(--foreground); font-size: 15px; line-height: 1.6; margin-bottom: 1.5rem;">
                Sua senha foi redefinida com sucesso. Você já pode acessar a plataforma utilizando suas novas credenciais de acesso.
            </p>

            <a href="{% url 'account_login' %}" class="auth-btn">
                Fazer Login Agora
            </a>
        </div>
    </div>
</div>
{% endblock %}
