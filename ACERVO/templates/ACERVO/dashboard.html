{% extends "ACERVO/base.html" %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    /* Inherits variables from base.html */

    .dashboard-wrapper {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background-color: var(--background);
        min-height: 100vh;
        color: var(--foreground);
    }

    .page-header {
        padding: 3rem 0 2rem 0;
        border-bottom: 1px solid var(--border);
    }

    .font-serif {
        font-family: "Libre Baskerville", Georgia, serif;
        color: var(--primary);
    }

    .stat-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow-sm);
        padding: 2rem;
        transition: var(--transition);
    }

    .stat-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
        border-color: var(--accent);
    }

    .stat-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
    }

    .icon-books {
        background-color: rgba(30, 41, 59, 0.08); /* Primary tint */
        color: var(--primary);
        border: 1px solid rgba(30, 41, 59, 0.15);
    }

    .icon-loans {
        background-color: rgba(196, 164, 96, 0.12); /* Accent tint */
        color: var(--accent);
        border: 1px solid rgba(196, 164, 96, 0.25);
    }

    .stat-title {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .stat-value {
        color: var(--primary);
        font-family: "Libre Baskerville", serif;
        font-size: 2.4rem;
        font-weight: 700;
        line-height: 1.1;
        margin-top: 0.2rem;
    }

    .chart-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow-md);
        padding: 2.5rem;
        margin-top: 2rem;
    }

    .chart-title {
        font-family: "Libre Baskerville", serif;
        color: var(--primary);
        font-weight: 700;
        font-size: 1.4rem;
    }

    .chart-container {
        position: relative;
        width: 100%;
        max-height: 420px; 
    }
</style>

<div class="dashboard-wrapper">
    <div class="container pb-5">
        
        <div class="page-header mb-4">
            <h2 class="font-serif fw-bold mb-1 h3">Painel de Estatísticas</h2>
            <p class="text-muted small mb-0">Métricas gerais e monitoramento de circulação do acervo patrimonial.</p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="stat-icon icon-books flex-shrink-0">
                        <i class="bi bi-bookshelf"></i>
                    </div>
                    <div>
                        <span class="stat-title d-block mb-1">Total de Livros</span>
                        <span class="stat-value d-block">{{ total_livros }}</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6">
                <div class="stat-card d-flex align-items-center gap-3">
                    <div class="stat-icon icon-loans flex-shrink-0">
                        <i class="bi bi-arrow-left-right"></i>
                    </div>
                    <div>
                        <span class="stat-title d-block mb-1">Total de Empréstimos</span>
                        <span class="stat-value d-block">{{ total_emprestimos }}</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <div class="d-flex align-items-center gap-2 mb-4">
                <i class="bi bi-bar-chart-line text-muted fs-5"></i>
                <h5 class="chart-title mb-0 h6">Popularidade por Categoria</h5>
            </div>
            
            <div class="chart-container">
                <canvas id="graficoCategorias"></canvas>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const ctx = document.getElementById('graficoCategorias');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [{% for c in emprestimos_por_categoria %}'{{ c.livro__categoria__nome }}',{% endfor %}],
                datasets: [{
                    label: 'Quantidade de Empréstimos',
                    data: [{% for c in emprestimos_por_categoria %}{{ c.total }},{% endfor %}],
                    backgroundColor: '#1e293b', /* Midnight Blue */
                    hoverBackgroundColor: '#c4a460', /* Soft Gold */
                    borderRadius: 6,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#64748b', /* Muted */
                            font: { 
                                family: '"IBM Plex Sans", sans-serif',
                                weight: '500',
                                size: 12
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#e2dfd8' /* Border line */
                        },
                        ticks: {
                            color: '#64748b', /* Muted */
                            stepSize: 1,
                            font: {
                                family: '"IBM Plex Sans", sans-serif'
                            }
                        }
                    }
                }
            }
        });
    });
</script>
{% endblock %}
